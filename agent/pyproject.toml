[project]
name = "travel-assistant-backend"
version = "0.1.0"
description = "FastAPI backend serving the travel assistant RAG agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=1.2.11",
    "langchain-community>=0.3,<0.4",
    "fastembed>=0.7.4",
    "onnxruntime<=1.23.2",
    "langchain-aws>=0.2.0",
    "opensearch-py>=2.7.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.43.83",
    "pyyaml>=6.0.0",
    "mcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph", "src/routes"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs a live OpenSearch + Bedrock backend running",
]
addopts = "-m 'not integration'"
