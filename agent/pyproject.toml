[project]
name = "travel-assistant-backend"
version = "0.1.0"
description = "FastAPI backend serving the travel assistant RAG agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=1.2.11",
    "langchain-openai>=1.5.1",
    "langchain-qdrant>=1.1.0",
    "langchain-community>=0.3,<0.4",
    "qdrant-client>=1.19.0",
    "fastembed>=0.7.4",
    "onnxruntime<=1.23.2",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph", "src/routes"]
