# docker-compose.yml
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./db/qdrant_storage:/qdrant/storage

  agent:
    build:
      context: ./agent
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./agent/main.py:/app/main.py
      - ./agent/src:/app/src
    environment:
      - ENVIRONMENT=development
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
    models:
      chat:
        endpoint_var: CHAT_BASE_URL
        model_var: CHAT_MODEL
    depends_on:
      - qdrant

  front-end:
    build:
      context: ./front-end
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./front-end/src:/app/src
      - ./front-end/public:/app/public
      - ./front-end/next.config.ts:/app/next.config.ts
      - ./front-end/tsconfig.json:/app/tsconfig.json
    environment:
      # the browser (on the host), not this container, makes these requests,
      # so this must be a host-reachable address, not the "agent" service DNS name
      - ENVIRONMENT=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_ASSISTANT_ID=agent
    depends_on:
      - agent

models:
  chat:
    model: hf.co/Qwen/Qwen2.5-3B-Instruct