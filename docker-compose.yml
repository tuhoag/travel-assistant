# docker-compose.yml
services:
  agent:
    image: tuhoag/travel-assistant-agent:${AGENT_IMAGE_TAG}
    build:
      context: ./agent
      target: ${ENVIRONMENT}
    ports:
      - "8000:8000"
    volumes:
      - ./agent/main.py:/app/main.py
      - ./agent/src:/app/src
      - ./agent/prompts:/app/prompts
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - CHAT_MODEL=${CHAT_MODEL}
      - ENVIRONMENT=${ENVIRONMENT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - OPENSEARCH_URL=${OPENSEARCH_URL}
      - OPENSEARCH_COLLECTION=${OPENSEARCH_COLLECTION}
      # Always the compose network name, not ${MCP_HOTELS_URL} — same
      # reasoning as mcp-hotels's own PGHOST: a container on this network
      # needs the Docker service name, not whatever a host-run process
      # would use.
      - MCP_HOTELS_URL=http://mcp-hotels:8080/mcp
    depends_on:
      - mcp-hotels

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mcp-hotels:
    image: tuhoag/travel-assistant-mcp-hotels:${MCP_HOTELS_IMAGE_TAG:-dev}
    build:
      context: ./mcp-hotels
      target: ${ENVIRONMENT}
    ports:
      - "8080:8080"
    volumes:
      - ./mcp-hotels/src:/app/src
    environment:
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Always the compose network name, not ${PGHOST} — .env's PGHOST is
      # for host-run tools (ingestion, bare `uv run`), which is a different
      # value (localhost) from what a container on this network needs.
      - PGHOST=postgres
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - HOTELS_DB_SECRET_ARN=${HOTELS_DB_SECRET_ARN}
    depends_on:
      - postgres

  frontend:
    image: tuhoag/travel-assistant-frontend:${FRONT_END_IMAGE_TAG}
    build:
      context: ./frontend
      target: ${ENVIRONMENT}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    environment:
      - AGENT_URL=${AGENT_URL:-http://agent:8000}
      - AGENT_ID=agent
      - ENVIRONMENT=${ENVIRONMENT}
    depends_on:
      - agent

volumes:
  postgres_data: