[project]
name = "mcp-hotels"
version = "0.1.0"
description = "MCP server exposing hotel search, backed by Postgres"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.35.0",
    "botocore[crt]>=1.43.83",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs a live Postgres backend running",
]
addopts = "-m 'not integration'"
