[project]
name = "pipelines-prefect"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.0.0",
    "python-dotenv>=1.0.0",
    "langchain-community",
    "langchain-core",
    "langchain-qdrant",
    "langchain-text-splitters",
    "qdrant-client",
    "fastembed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flows"]
