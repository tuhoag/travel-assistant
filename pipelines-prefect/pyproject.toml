[project]
name = "pipelines-prefect"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.0.0",
    "python-dotenv>=1.0.0",
    "langchain-community",
    "langchain-core",
    "langchain-text-splitters",
    "fastembed",
    "opensearch-py>=2.7.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.43.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flows"]
